[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe30"
version = "0.1.0"
description = "Auditable research and submission tooling for the DOE GEMS fault-mapping challenge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GEMSDOE30 contributors" }]
dependencies = []

[project.optional-dependencies]
train = [
  "numpy>=1.24",
  "scipy>=1.10",
  "rasterio>=1.3",
  "torch>=2.1",
]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
