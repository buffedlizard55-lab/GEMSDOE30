name: Review regression tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[research,test]' -c requirements-tdx1.txt
      - name: Restore only the hash-pinned output template and catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_check.py python scripts/restore_public_mirrors.py --ids sample_submission labels
      - name: Restore the hash-pinned 13GEMSDOE duplicate witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_check.py python scripts/restore_public_mirrors.py --pins docs/research/2026-10-27-registry-preflight/lattice-pin.json --ids registry_lattice
      - name: Restore nine pinned historical references without rewriting receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_check.py python scripts/audit_priority_readiness.py --restore-only
      - name: Remeasure all nine references offline and check the executive audit
        run: python scripts/ci_check.py python scripts/audit_priority_readiness.py --check
      - name: Verify the current research artifact and the preserved negative decisions
        run: |
          python scripts/ci_check.py python scripts/verify_current_run.py
          python scripts/ci_check.py python scripts/verify_stopped_attempt.py
          python scripts/ci_check.py python scripts/verify_geothermal_chemistry_run.py
          python scripts/ci_check.py python scripts/verify_quadrature_phase_run.py
          python scripts/ci_check.py python scripts/verify_csr_run.py
          python scripts/ci_check.py python scripts/verify_registry_preflight.py
          python scripts/ci_check.py python scripts/verify_lsm_run.py
          python scripts/ci_check.py python scripts/verify_tad_run.py
          python scripts/ci_check.py python scripts/build_research_site.py --check
      - name: Run tests with API-readable failure diagnostics
        run: python scripts/ci_check.py python -m pytest -q
      - run: git diff --check
