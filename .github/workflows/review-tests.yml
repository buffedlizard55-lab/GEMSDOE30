name: Review regression tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[research,test]' -c requirements-tdx1.txt
      - name: Restore only the hash-pinned output template
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_check.py python scripts/restore_public_mirrors.py --ids sample_submission
      - name: Verify the current promoted research artifact, stopped lanes, and Pages site
        run: |
          python scripts/ci_check.py python scripts/verify_current_run.py --require-promote
          python scripts/ci_check.py python scripts/verify_stopped_attempt.py
          python scripts/ci_check.py python scripts/verify_lsm_run.py
          python scripts/ci_check.py python scripts/build_research_site.py --check
      - name: Run tests with API-readable failure diagnostics
        run: python scripts/ci_check.py python -m pytest -q
      - run: git diff --check
