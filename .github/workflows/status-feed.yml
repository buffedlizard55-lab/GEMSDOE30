name: status-feed

# Why this workflow exists
# ------------------------
# The owner brief requires an always-current project feed instead of manually
# re-checked status text, without violating the DrivenData Terms of Use (which
# prohibit robots/automated monitoring of the competition site).  This workflow
# keeps the feed honest by regenerating it only from evidence that already lives
# in the repository (gate JSONs, download sidecars, mirror pins, the score
# ledger) and by re-running the GeoTIFF format checks against the hash-pinned
# competition template fetched from the public mirror.  It never contacts
# drivendata.org.
#
# Reference links only; respect the platform Terms, including its restrictions
# on automated access and unauthorized monitoring/copying:
#   Competition rules and data tab   https://www.drivendata.org/competitions/306/competition-doe-gems/
#   Official rules PDF               https://docs.nlr.gov/docs/fy26osti/96647.pdf
#   Public leaderboard               https://www.drivendata.org/competitions/306/competition-doe-gems/leaderboard/

on:
  push:
    branches:
      - main
    paths:
      - "docs/research/**"
      - "docs/downloads/**"
      - "scripts/**.py"
      - "src/**.py"
      - "docs/score-ledger.csv"
      - "docs/current-run.json"
      - "requirements-tdx1.txt"
      - "pyproject.toml"
      - "docs/assets/**"
      - "index.html"
      - "executive-summary.html"
      - "experiment-review.html"
      - "priority-site-review.html"
      - ".github/workflows/status-feed.yml"
  schedule:
    # Weekly refresh so a stale feed is visible even when nothing is pushed.
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# Two workflows can be triggered by the same push (this one and
# fetch-external-layers).  Serialise this one per branch so its `git push` can
# never race another workflow's push (the failure mode that produced IR-30-043).
concurrency:
  group: status-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install readers and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[research,test]' -c requirements-tdx1.txt

      - name: Fetch hash-pinned template and catalogue (public mirrors, not training stack)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_check.py python scripts/restore_public_mirrors.py --ids sample_submission labels

      - name: Verify current artifact, automatic decision and generated site
        run: |
          python scripts/ci_check.py python scripts/verify_current_run.py
          python scripts/ci_check.py python scripts/verify_stopped_attempt.py
          python scripts/ci_check.py python scripts/verify_geothermal_chemistry_run.py
          python scripts/ci_check.py python scripts/verify_quadrature_phase_run.py
          python scripts/ci_check.py python scripts/verify_lsm_run.py
          python scripts/ci_check.py python scripts/build_research_site.py --check

      - name: Re-run GeoTIFF format checks on every published research file
        continue-on-error: true
        run: |
          set -x
          shopt -s nullglob
          mkdir -p docs/research/format-checks
          while IFS= read -r -d '' file; do
            [ -f "$file" ] || continue
            # NOTE: receipts go to docs/research/format-checks/, never over the
            # provenance sidecar next to the TIFF (IR-30-042: an earlier version
            # of this workflow wrote the validation payload over every sidecar,
            # destroying hashes, run names and notes).
            python scripts/validate_submission.py "$file" \
              --template data/raw/sample_submission.tif \
              --json "docs/research/format-checks/$(basename "${file%.tif}").json" \
              && echo "OK $file" || echo "::warning file=$file::local format check failed or template missing"
          done < <(find docs -type f \( -iname '*.tif' -o -iname '*.tiff' \) -print0)

      - name: Regenerate status after validation (not before it)
        run: python scripts/build_status.py --output docs/status.json

      - name: Commit the refreshed feed
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/status.json docs/research/format-checks
          if git diff --cached --quiet; then
            echo "status feed unchanged"
          else
            git commit -m "status feed: regenerate from artifacts [skip ci]"
            # Rebase first: a sibling workflow may have pushed since checkout.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
